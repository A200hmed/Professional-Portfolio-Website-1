<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Key Authentication | Sterling Suite</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="min-height: 100vh; overflow-y: hidden;">

  <!-- Floating Background Overlay Blobs -->
  <div class="background-grid"></div>
  <div class="mesh-glow-1" style="width: 40vw; height: 40vw; left: 10%;"></div>
  <div class="mesh-glow-2" style="width: 40vw; height: 40vw; right: 10%;"></div>

  <div class="login-panel">
    <div class="glass-card login-card" style="opacity: 0; transform: scale(0.95); animation: zoomInLoad 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
      <h2 class="login-title text-gradient">System Portal</h2>
      <p class="login-desc">Authorize administrative session keys</p>

      <!-- Status Notification Box -->
      <div class="status-msg" id="login-status"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-username">Identity Key</label>
          <input type="text" id="login-username" class="form-input" placeholder="Enter admin username" required>
        </div>

        <div class="form-group" style="margin-bottom: 32px;">
          <label class="form-label" for="login-password">Authorization Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter security passphrase" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 50px;">
          Submit Passkey
        </button>

        <a href="index.html" class="btn btn-secondary" style="width: 100%; justify-content: center; margin-top: 12px; height: 50px; font-weight: 500;">
          Return to Showcase
        </a>
      </form>
    </div>
  </div>

  <style>
    @keyframes zoomInLoad {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

  <script src="js/admin.js"></script>
</body>
</html>
